
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  android:
    name: Build SilverSpeedWay69
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Sync game files
        run: npx cap sync android

      - name: Install image tools
        run: python3 -m pip install Pillow --break-system-packages

      - name: Generate Android app icons
        shell: bash
        run: |
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          base = Path("android/app/src/main/res")
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          square = Image.open("s69-square.png").convert("RGBA")
          round_icon = Image.open("s69-round.png").convert("RGBA")

          for folder, size in sizes.items():
              target = base / folder
              target.mkdir(parents=True, exist_ok=True)

              square.resize(
                  (size, size),
                  Image.Resampling.LANCZOS
              ).save(target / "ic_launcher.png")

              round_icon.resize(
                  (size, size),
                  Image.Resampling.LANCZOS
              ).save(target / "ic_launcher_round.png")

              square.resize(
                  (size, size),
                  Image.Resampling.LANCZOS
              ).save(target / "ic_launcher_foreground.png")

          # Update adaptive launcher background.
          values = base / "values"
          values.mkdir(parents=True, exist_ok=True)
          (values / "ic_launcher_background.xml").write_text(
              '<resources><color name="ic_launcher_background">'
              '#000000</color></resources>'
          )

          # Keep Android adaptive icon XML resources and use a properly
          # masked foreground, preventing square art inside a round icon.
          from PIL import ImageDraw
          for folder, size in sizes.items():
              target = base / folder
              mask = Image.new("L", (size, size), 0)
              draw = ImageDraw.Draw(mask)
              draw.ellipse((0, 0, size - 1, size - 1), fill=255)
              rounded = round_icon.resize((size, size), Image.Resampling.LANCZOS)
              rounded.putalpha(Image.composite(rounded.getchannel("A"), Image.new("L", (size, size), 0), mask))
              rounded.save(target / "ic_launcher_round.png")

          # Adaptive icon foreground is inset to the central safe area.
          # The system applies the launcher's circle or rounded-square mask.
          for folder, size in sizes.items():
              target = base / folder
              canvas = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              art_size = round(size * 0.66)
              art = square.resize((art_size, art_size), Image.Resampling.LANCZOS)
              canvas.alpha_composite(art, ((size - art_size) // 2, (size - art_size) // 2))
              canvas.save(target / "ic_launcher_foreground.png")

          adaptive = base / "mipmap-anydpi-v26"
          adaptive.mkdir(parents=True, exist_ok=True)
          for name in ("ic_launcher", "ic_launcher_round"):
              (adaptive / f"{name}.xml").write_text(
                  '<?xml version="1.0" encoding="utf-8"?>\\n'
                  '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">'
                  '<background android:drawable="@color/ic_launcher_background"/>'
                  '<foreground android:drawable="@mipmap/ic_launcher_foreground"/>'
                  '</adaptive-icon>'
              )
          PY

      - name: Make Gradle executable
        working-directory: android
        run: chmod +x gradlew

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mv android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/SilverSpeedWay69.apk

      - name: Verify APK
        run: |
          test -f android/app/build/outputs/apk/debug/SilverSpeedWay69.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SilverSpeedWay69-Android
          path: android/app/build/outputs/apk/debug/SilverSpeedWay69.apk
          if-no-files-found: error
          retention-days: 30
          
